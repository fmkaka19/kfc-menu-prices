    <line x1="16" y1="23" x2="28" y2="23" stroke="#8B1E1E" stroke-width="2" stroke-linecap="round"/>
    <line x1="16" y1="27" x2="25" y2="27" stroke="#E6A23C" stroke-width="2" stroke-linecap="round"/>
