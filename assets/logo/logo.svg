    <!-- Menu/Tag Graphic -->
    <path d="M12 15C12 13.8954 12.8954 13 14 13H30C31.1046 13 32 13.8954 32 15V29C32 30.1046 31.1046 31 30 31H14C12.8954 31 12 30.1046 12 29V15Z" fill="#FFF9F2"/>
