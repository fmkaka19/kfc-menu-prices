<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B1E1E"/>
      <stop offset="50%" stop-color="#5C1212"/>
      <stop offset="100%" stop-color="#241F1F"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9D423"/>
      <stop offset="100%" stop-color="#FF4E50"/>
    </linearGradient>
    <linearGradient id="chickenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E67E22"/>
      <stop offset="100%" stop-color="#D35400"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid/Pattern Circles -->
  <circle cx="700" cy="80" r="220" fill="#E6A23C" opacity="0.08"/>
  <circle cx="100" cy="380" r="180" fill="#FFFFFF" opacity="0.04"/>

  <!-- Bucket Main Visual Group -->
  <g transform="translate(420, 90)" filter="url(#shadow)">
    <!-- Bucket Body -->
    <path d="M 40,80 L 260,80 L 230,280 C 230,290 220,300 200,300 L 100,300 C 80,300 70,290 70,280 Z" fill="#FFF9F2"/>
    <!-- Red Bucket Stripe -->
    <path d="M 46,120 L 254,120 L 246,180 L 54,180 Z" fill="#8B1E1E"/>
    <path d="M 50,150 L 250,150 L 248,165 L 52,165 Z" fill="#E6A23C"/>
    
    <!-- Fried Chicken Pieces Overflowing -->
    <!-- Piece 1 -->
    <path d="M 50,85 C 30,50 60,10 100,30 C 130,10 160,30 150,75 Z" fill="url(#goldGrad)"/>
    <circle cx="80" cy="45" r="4" fill="#8B1E1E" opacity="0.4"/>
    <circle cx="110" cy="35" r="5" fill="#8B1E1E" opacity="0.3"/>
    
    <!-- Piece 2 -->
    <path d="M 130,75 C 120,30 170,0 210,25 C 240,15 260,45 240,85 Z" fill="url(#chickenGrad)"/>
    <circle cx="180" cy="40" r="5" fill="#FFF9F2" opacity="0.4"/>

    <!-- Piece 3 Center High -->
    <path d="M 90,60 C 90,10 170,-10 200,40 C 210,60 180,80 140,80 Z" fill="url(#goldGrad)"/>
    
    <!-- Bucket Badge -->
    <rect x="110" y="200" width="80" height="60" rx="8" fill="#8B1E1E"/>
    <text x="150" y="225" font-family="'Playfair Display', Georgia, serif" font-size="16" font-weight="bold" fill="#FFF9F2" text-anchor="middle">KFC</text>
    <text x="150" y="245" font-family="'Inter', sans-serif" font-size="10" font-weight="bold" fill="#E6A23C" text-anchor="middle">FAMILY</text>
  </g>

  <!-- Left Text Banner Group -->
  <g transform="translate(50, 120)">
    <rect width="140" height="32" rx="16" fill="#E6A23C"/>
    <text x="70" y="21" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#241F1F" text-anchor="middle" letter-spacing="1">FRESH &amp; CRISPY</text>
    
    <text x="0" y="80" font-family="'Playfair Display', Georgia, serif" font-size="38" font-weight="bold" fill="#FFFFFF">Full Menu &amp;</text>
    <text x="0" y="125" font-family="'Playfair Display', Georgia, serif" font-size="38" font-weight="bold" fill="#E6A23C">Updated Prices</text>
    
    <text x="0" y="165" font-family="'Inter', sans-serif" font-size="15" fill="#E8E1D8">Explore combos, chicken buckets, sandwiches &amp; deals.</text>
    
    <!-- Rating Pill -->
    <g transform="translate(0, 195)">
      <rect width="210" height="40" rx="8" fill="#FFFFFF" fill-opacity="0.1"/>
      <text x="15" y="25" font-family="'Inter', sans-serif" font-size="14" font-weight="bold" fill="#F9D423">★ 4.9</text>
      <text x="65" y="25" font-family="'Inter', sans-serif" font-size="13" fill="#FFFFFF">| 2026 Price Guide</text>
    </g>
  </g>
</svg>
