<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" fill="none">
  <rect width="600" height="400" rx="12" fill="#FFF9F2"/>
  
  <g transform="translate(230, 50)">
    <!-- Cup -->
    <path d="M 20,60 L 120,60 L 100,300 L 40,300 Z" fill="#8B1E1E"/>
    <path d="M 15,45 L 125,45 L 125,60 L 15,60 Z" fill="#E8E1D8"/>
    <!-- Lid Straw -->
    <rect x="66" y="0" width="10" height="50" fill="#E6A23C" transform="rotate(-12 66 0)"/>
    <!-- Branding Text on Cup -->
    <text x="70" y="180" font-family="'Playfair Display', serif" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">DRINK</text>
    <text x="70" y="210" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#E6A23C" text-anchor="middle">ICE COLD</text>
  </g>

  <rect x="30" y="30" width="90" height="32" rx="6" fill="#8B1E1E"/>
  <text x="75" y="51" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">DRINKS</text>
</svg>
