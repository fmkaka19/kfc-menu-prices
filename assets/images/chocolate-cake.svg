<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" fill="none">
  <rect width="600" height="400" rx="12" fill="#FFF9F2"/>
  
  <g transform="translate(180, 100)">
    <!-- Plate -->
    <ellipse cx="120" cy="210" rx="150" ry="40" fill="#E8E1D8"/>
    <!-- Cake Slice -->
    <path d="M 40,160 L 200,160 L 140,40 Z" fill="#5C1212"/>
    <path d="M 40,160 L 200,160 L 200,190 L 40,190 Z" fill="#3D0B0B"/>
