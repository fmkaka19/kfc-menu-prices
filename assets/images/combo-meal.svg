<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" fill="none">
  <rect width="600" height="400" rx="12" fill="#FFF9F2"/>
  
  <!-- Drink Cup -->
  <g transform="translate(400, 100)">
    <path d="M 20,40 L 80,40 L 70,220 L 30,220 Z" fill="#8B1E1E"/>
    <path d="M 15,30 L 85,30 L 85,40 L 15,40 Z" fill="#E8E1D8"/>
    <rect x="46" y="0" width="8" height="40" fill="#E6A23C" transform="rotate(-15 46 0)"/>
    <text x="50" y="140" font-family="'Inter', sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">DRINK</text>
  </g>

  <!-- Fries Box -->
  <g transform="translate(100, 130)">
    <path d="M 20,60 L 80,60 L 70,200 L 30,200 Z" fill="#8B1E1E"/>
    <!-- Fries Stalks -->
    <rect x="25" y="10" width="8" height="60" rx="2" fill="#F39C12"/>
    <rect x="35" y="0" width="8" height="70" rx="2" fill="#F1C40F"/>
    <rect x="45" y="15" width="8" height="55" rx="2" fill="#F39C12"/>
    <rect x="55" y="5" width="8" height="65" rx="2" fill="#F1C40F"/>
    <rect x="65" y="20" width="8" height="50" rx="2" fill="#F39C12"/>
  </g>

  <!-- Main Piece -->
  <g transform="translate(200, 180)">
    <path d="M 30,40 C 20,10 70,-10 110,20 C 140,10 160,40 140,80 C 110,100 40,80 30,40 Z" fill="#E67E22" stroke="#D35400" stroke-width="4"/>
  </g>
  
  <rect x="30" y="30" width="100" height="32" rx="6" fill="#8B1E1E"/>
  <text x="80" y="51" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">COMBO</text>
</svg>
