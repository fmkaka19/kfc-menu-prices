<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" fill="none">
  <rect width="600" height="400" rx="12" fill="#FFF9F2"/>
  
  <!-- Bucket Graphic -->
  <g transform="translate(180, 50)">
    <path d="M 30,70 L 210,70 L 190,270 C 190,280 180,290 160,290 L 80,290 C 60,290 50,280 50,270 Z" fill="#FFFFFF" stroke="#E8E1D8" stroke-width="4"/>
    <path d="M 35,110 L 205,110 L 198,160 L 42,160 Z" fill="#8B1E1E"/>
    <!-- Bucket Text -->
    <text x="120" y="142" font-family="'Playfair Display', serif" font-size="20" font-weight="bold" fill="#FFF9F2" text-anchor="middle">FAMILY BUCKET</text>
    
    <!-- Chicken Pile -->
    <path d="M 40,75 C 20,40 60,10 90,30 C 120,10 150,30 140,70 Z" fill="#E67E22"/>
    <path d="M 110,65 C 100,20 160,-10 190,25 C 210,15 220,45 200,75 Z" fill="#D35400"/>
    <path d="M 70,50 C 70,10 140,-20 160,30 C 170,50 140,70 110,70 Z" fill="#F39C12"/>
  </g>
  
  <!-- Side Dish Bowls -->
  <!-- Bowl 1: Mashed Potatoes -->
  <ellipse cx="110" cy="280" rx="45" ry="25" fill="#E8E1D8"/>
  <ellipse cx="110" cy="275" rx="38" ry="18" fill="#FFF9F2"/>
  <ellipse cx="110" cy="273" rx="25" ry="10" fill="#D35400"/>
  <!-- Bowl 2: Coleslaw -->
  <ellipse cx="490" cy="280" rx="45" ry="25" fill="#E8E1D8"/>
  <ellipse cx="490" cy="275" rx="38" ry="18" fill="#2ECC71"/>
  
  <rect x="30" y="30" width="130" height="32" rx="6" fill="#8B1E1E"/>
  <text x="95" y="51" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">FAMILY MEAL</text>
</svg>
